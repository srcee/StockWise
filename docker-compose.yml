version: "3"

services:
  mongodb:
    image: mongo
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  backend:
    build:
      context: .
      dockerfile: apps/stockwise-be/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DATABASE: stockwise
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
  frontend:
    build:
      context: .
      dockerfile: apps/stockwise-fe/Dockerfile
      args:
        VITE_BACKEND_BASE_URL: http://localhost:5000/api/
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
